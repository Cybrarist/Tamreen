[supervisord]
user=root
nodaemon=true
logfile=/logs/supervisord_stdout.log
pidfile=/var/run/supervisord.pid

[program:octane]
command=php artisan octane:frankenphp --host=$FRANKEN_HOST --port=80   --workers=4 --max-requests=1000 --admin-port=2019
user=root
autostart=true
autorestart=true
priority=2
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/logs/octane_stdout.log
stderr_logfile=/logs/octane_stderr.log

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php artisan queue:work --sleep=3  --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/logs/octane_stdout.log
stdout_logfile=/logs/octane_stderr.log
stopwaitsecs=3600
